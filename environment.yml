name: cassette2vec
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - jupyter=1.0.0
  - notebook=7.1.2
  - pip:
    # scikit-learn and xgboost pinned to the versions reported in the paper.
    - scikit-learn==1.3.2
    - xgboost==2.0.3
    - shap==0.44.1
    - pandas==2.2.1
    - numpy==1.26.4
    - scipy==1.11.4
    - matplotlib==3.8.3
    - seaborn==0.13.2
    - joblib==1.3.2
    - biopython==1.83
